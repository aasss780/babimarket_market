<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabiMarket - Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #FF6F43; --bg-color: #FBF9F6; --text-dark: #1A1A1A; --border-color: #EFEFEF; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); padding: 40px 20px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; }
        
        .section-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color); }
        .card { background: #fff; padding: 30px; border-radius: 16px; border: 1px solid var(--border-color); margin-bottom: 30px; }
        
        /* Form Inputs */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;}
        label { font-size: 13px; font-weight: 600; color: #555; }
        input, select { width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--primary); }

        /* Payment Methods */
        .payment-method { display: flex; align-items: center; gap: 15px; padding: 15px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: 0.3s; }
        .payment-method:hover, .payment-method.active { border-color: var(--primary); background: #FFF0EB; }
        .payment-method input { width: auto; }

        /* Order Summary */
        .summary-card { position: sticky; top: 20px; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; }
        .cart-item img { width: 70px; height: 70px; border-radius: 10px; object-fit: cover; }
        .item-details h4 { font-size: 14px; margin-bottom: 5px; }
        .item-details p { font-size: 12px; color: #777; }
        .item-price { font-weight: 700; margin-left: auto; }
        
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; color: #555; }
        .summary-total { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 20px; font-weight: 800; color: var(--text-dark); }
        
        .checkout-btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 16px; margin-top: 25px; cursor: pointer; transition: 0.3s; }
        .checkout-btn:hover { background: #E65A2B; }

        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } .summary-card { order: -1; position: static; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkout-forms">
            <div class="card">
                <h2 class="section-title">Shipping Address</h2>
                <div class="form-row">
                    <div class="input-group"><label>First Name</label><input type="text" placeholder="John"></div>
                    <div class="input-group"><label>Last Name</label><input type="text" placeholder="Doe"></div>
                </div>
                <div class="input-group"><label>Email Address</label><input type="email" placeholder="john@example.com"></div>
                <div class="input-group"><label>Street Address</label><input type="text" placeholder="123 Baby Street"></div>
                <div class="form-row">
                    <div class="input-group"><label>City</label><input type="text" placeholder="New York"></div>
                    <div class="input-group"><label>ZIP Code</label><input type="text" placeholder="10001"></div>
                </div>
            </div>

            <div class="card">
                <h2 class="section-title">Payment Method</h2>
                <label class="payment-method active">
                    <input type="radio" name="payment" checked> <i class="fa-regular fa-credit-card"></i> Credit Card
                </label>
                <label class="payment-method">
                    <input type="radio" name="payment"> <i class="fa-brands fa-paypal"></i> PayPal
                </label>
                <label class="payment-method">
                    <input type="radio" name="payment"> <i class="fa-solid fa-money-bill-wave"></i> Cash on Delivery
                </label>
            </div>
        </div>

        <div class="summary-card">
            <div class="card">
                <h2 class="section-title">Order Summary</h2>
                <div class="cart-items">
                    <div class="cart-item">
                        <img src="https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?q=80&w=150&auto=format&fit=crop">
                        <div class="item-details">
                            <h4>Organic Cotton Onesie</h4>
                            <p>Qty: 1 | Size: 3-6M</p>
                        </div>
                        <div class="item-price">$24.99</div>
                    </div>
                    <div class="cart-item">
                        <img src="https://images.unsplash.com/photo-1515488764276-beab7607c1e6?q=80&w=150&auto=format&fit=crop">
                        <div class="item-details">
                            <h4>Wooden Stacker Toy</h4>
                            <p>Qty: 1</p>
                        </div>
                        <div class="item-price">$18.50</div>
                    </div>
                </div>
                
                <div style="margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                    <div class="summary-row"><span>Subtotal</span><span>$43.49</span></div>
                    <div class="summary-row"><span>Shipping</span><span>$5.00</span></div>
                    <div class="summary-row"><span>Taxes</span><span>$2.17</span></div>
                    <div class="summary-total"><span>Total</span><span>$50.66</span></div>
                </div>
                <button class="checkout-btn">Place Order Securely</button>
            </div>
        </div>
    </div>
</body>
</html>
