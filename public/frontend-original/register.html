<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabiMarket - Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FF6F43;
            --bg: #FBF9F6;
            --white: #FFFFFF;
            --text-dark: #1A1A1A;
            --text-gray: #7A7A7A;
            --border: #EFEFEF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { background-color: var(--bg); color: var(--text-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 40px 0; }

        .login-card { background-color: var(--white); width: 90%; max-width: 450px; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.03); text-align: center; }

        .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .logo-icon { background: #4CAF50; color: white; width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; border-radius: 8px; font-size: 18px; font-weight: bold; }
        .logo-text { font-size: 20px; font-weight: 800; color: #1E3A34; }

        .welcome-text h1 { font-size: 28px; font-weight: 800; margin-bottom: 10px; color: var(--text-dark); }
        .welcome-text p { font-size: 14px; color: var(--text-gray); margin-bottom: 30px; }

        .wants-to { margin-bottom: 25px; text-align: left; }
        .wants-to-title { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 15px; display: block; }
        .roles-container { display: flex; gap: 15px; }
        .role-option { flex: 1; position: relative; }
        
        .role-option input { display: none; }
        .role-label { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 10px; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; transition: 0.3s; background-color: #F9F9F9; }
        .role-option input:checked + .role-label { border-color: var(--primary); background-color: var(--white); box-shadow: 0 5px 15px rgba(255,111,67,0.05); }
        
        .role-icon { font-size: 22px; color: var(--text-gray); margin-bottom: 10px; transition: 0.3s; }
        .role-option input:checked + .role-label .role-icon { color: var(--primary); }
        
        .role-text-main { font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 3px; }
        .role-text-sub { font-size: 11px; color: var(--text-gray); font-weight: 500; }

        .form-group { margin-bottom: 18px; text-align: left; }
        label { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 8px; display: block; }
        input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background-color: #F9F9F9; font-size: 14px; transition: 0.3s; }
        input:focus { outline: none; border-color: var(--primary); background-color: white; }

        /* تنسيق لتقسيم الباسورد وتأكيده ليكونوا جنب بعض في الشاشات الكبيرة (اختياري، للجمالية) */
        .password-row { display: flex; gap: 15px; }
        .password-row .form-group { flex: 1; }

        .btn-primary { width: 100%; padding: 14px; background-color: var(--primary); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-bottom: 25px; margin-top: 10px; }
        .btn-primary:hover { background-color: #E65A2B; }

        .footer-text { font-size: 13px; color: var(--text-dark); font-weight: 500; }
        .footer-text a { color: var(--primary); text-decoration: none; font-weight: 700; }

        @media (max-width: 480px) {
            .password-row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">
            <div class="logo-icon">B</div>
            <span class="logo-text">BabiMarket</span>
        </div>

        <div class="welcome-text">
            <h1>Create Account</h1>
            <p>Join BabiMarket today</p>
        </div>

        <form action="#" method="POST">
            <div class="wants-to">
                <span class="wants-to-title">I want to:</span>
                <div class="roles-container">
                    <div class="role-option">
                        <input type="radio" id="roleCustomer" name="role" value="customer" checked>
                        <label for="roleCustomer" class="role-label">
                            <i class="fa-solid fa-cart-shopping role-icon"></i>
                            <span class="role-text-main">Shop as Customer</span>
                            <span class="role-text-sub">Browse and buy products</span>
                        </label>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="roleSeller" name="role" value="seller">
                        <label for="roleSeller" class="role-label">
                            <i class="fa-solid fa-store role-icon"></i>
                            <span class="role-text-main">Sell Products</span>
                            <span class="role-text-sub">Start your online store</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Jane Smith" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="password-row">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="........" required>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="........" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

</body>
</html>
